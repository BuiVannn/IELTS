<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Practice</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E66">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F5;--surface:#fff;--surface-2:#EBEFED;--ink:#14201E;--ink-2:#3A4845;--mute:#62706C;--line:#DCE3E0;--line-2:#C5CFCB;
  --brand:#0B6E66;--brand-ink:#fff;--brand-soft:#E1F0ED;--brand-line:#A9D3CC;
  --ok:#1F7A3A;--ok-soft:#E3F3E7;--warn:#A8650A;--warn-soft:#FBF0DC;--bad:#B42318;--bad-soft:#FDE8E6;
  --b5:#D7ECE8;--b6:#9FD0C7;--b7:#3E9C8F;--b8:#0B5E57;--b-ink:#fff;
  /* màu chuỗi dữ liệu W/S/R/Từ/L — đã qua validate_palette (mù màu, sáng + tối) */
  --sW:#00917F;--sS:#C2760C;--sR:#5B5FC7;--sV:#B8466E;--sL:#3F7FB8;--grid:#E4E9E7;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--read:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:10px;--shadow:0 1px 2px rgba(20,32,30,.05);--shadow-lg:0 12px 32px rgba(20,32,30,.12);
  --side:240px;--focus:0 0 0 3px rgba(11,110,102,.3);
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0E1513;--surface:#151E1C;--surface-2:#1C2724;--ink:#E6EDEB;--ink-2:#C2CDCA;--mute:#93A29E;--line:#26332F;--line-2:#33423E;
  --brand:#4FC1B1;--brand-ink:#06201C;--brand-soft:#123430;--brand-line:#1F5A52;
  --ok:#5FD08A;--ok-soft:#10301C;--warn:#F0B254;--warn-soft:#33250D;--bad:#FF8A7E;--bad-soft:#3A1512;
  --b5:#1A3833;--b6:#1F5A52;--b7:#2E8C7F;--b8:#5FCFBE;--b-ink:#06201C;
  --sW:#1F9C8C;--sS:#BD7F22;--sR:#7175DE;--sV:#CC5F88;--sL:#4A8FCB;--grid:#22302C;
  --shadow:none;--shadow-lg:0 12px 32px rgba(0,0,0,.5);--focus:0 0 0 3px rgba(79,193,177,.4)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
[data-lucide],svg.lucide{width:18px;height:18px;stroke-width:1.9;flex:none}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px;z-index:20;transition:width .2s ease;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;padding:4px 0 16px 4px;min-height:52px}
.brand img{width:34px;height:34px;border-radius:9px;flex:none}
.brand .bt{display:grid;line-height:1.25;white-space:nowrap;min-width:0;overflow:hidden}
.brand .bt b{font-size:15.5px}.brand .bt span{font-size:12px;color:var(--mute)}
.brand .tog{margin-left:auto;width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--mute);display:grid;place-items:center;flex:none}
.brand .tog:hover{background:var(--surface-2);color:var(--ink)}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;min-height:40px;border-radius:9px;color:var(--ink-2);font-weight:500;margin:1px 0;white-space:nowrap}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav a .pill{margin-left:auto;font:600 11px var(--mono);padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.nav a .pill.hot{background:var(--sV);color:#fff}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:14px 10px 4px;font-weight:600;white-space:nowrap}
.today{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.today svg.rg{width:44px;height:44px;transform:rotate(-90deg)}
.today .rg circle{fill:none;stroke-width:5}
.today .tx{display:grid;gap:1px;font-size:12px;color:var(--mute);white-space:nowrap;min-width:0}
.today .tx>*{overflow:hidden;text-overflow:ellipsis}
.today .tx b{font:600 17px/1.2 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.today .tx .fl{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
.today .tx .fl svg{width:14px;height:14px;color:var(--sS)}
/* thu gọn: chỉ còn icon */
body.mini{--side:72px}
body.mini .brand{flex-direction:column;gap:8px;padding:4px 0 12px}
body.mini .brand .bt,body.mini .nav .lbl,body.mini .nav .pill,body.mini .today .tx{display:none}
body.mini .brand .tog{margin:0}
body.mini .nav .sec{font-size:0;padding:8px 0;margin:6px 10px;border-top:1px solid var(--line)}
body.mini .nav a{justify-content:center;padding:8px 0}
body.mini .nav a.dot::after{content:"";position:absolute;top:7px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--sV)}
body.mini .today{grid-template-columns:1fr;justify-items:center;padding:8px 0;border:0;background:none}
.tip-r{position:fixed;z-index:40;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap}
.content{transition:margin-left .2s ease}
.content{margin-left:var(--side);min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:28px 32px 96px}
.tabbar{display:none}
.clock{position:fixed;right:16px;bottom:16px;z-index:25;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgb(0 0 0/.08);font-size:12px;color:var(--mute)}
.clock b{font:600 14px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.clock i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.clock.on i{background:var(--brand);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.clock.on i{animation:none}}
@media (max-width:900px){.clock{bottom:calc(76px + env(safe-area-inset-bottom))}.clock span{display:none}}
body.focus .clock{bottom:16px}
@media (max-width:900px){
  .side{display:none}.content{margin-left:0}main{padding:18px 16px 96px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--mute);min-height:52px}
  .tabbar a.on{color:var(--brand)}.tabbar a:hover{text-decoration:none}
  .tabbar{overflow-x:auto}.tabbar a{flex:1 0 62px;white-space:nowrap}
}
body.focus .side,body.focus .tabbar{display:none}
body.focus .content{margin-left:0}
body.focus main{max-width:none;padding:0}

/* ---------- primitives ---------- */
h1{font-size:24px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0}
.sub{color:var(--mute);margin:0 0 20px}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.section{margin-top:32px}
.section-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:38px;padding:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.key{background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mute);min-height:30px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none;min-height:36px}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px 0 36px}
.search [data-lucide],.search svg{position:absolute;left:11px;top:10px;color:var(--mute)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.meter.target::after{content:"";position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:var(--t)}
.kpi{font:600 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:13px;color:var(--mute);font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:var(--shadow-lg);max-width:90vw}

/* ---------- list table ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.group{margin-top:24px}
.group-h{display:flex;align-items:center;gap:10px;padding:0 4px 8px;flex-wrap:wrap}
.group-h h2{font-size:15px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 20px;align-items:center;gap:12px;padding:0 14px 0 6px;min-height:52px;border-top:1px solid var(--line);color:inherit}
.r:first-child{border-top:0}
.r:hover{background:var(--surface-2);text-decoration:none}
.r .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .m{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sc{font-size:13px;color:var(--mute);text-align:right;min-width:64px;font-variant-numeric:tabular-nums}
.st{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--line-2);border-radius:8px}
.st:hover{background:var(--surface)}
.st.done{color:var(--ok)}.st.doing{color:var(--warn)}
@media (max-width:640px){.r{grid-template-columns:40px minmax(0,1fr) auto 16px}.r .sc{display:none}.toolbar .search{max-width:none;flex-basis:100%}.seg{max-width:100%;overflow-x:auto}}

/* ---------- exam ---------- */
.fbar{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}
.fbar .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.steps{display:flex;gap:4px;margin:0 auto}
.steps button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);height:34px;min-width:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.steps button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.steps button .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.steps button .dot.full{background:var(--ok)}
.timer{font:600 15px var(--mono);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.timer.warn{color:var(--warn);border-color:var(--warn)}.timer.low{color:var(--bad);border-color:var(--bad)}
.ebody{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 60px)}
.ebody.open{grid-template-columns:minmax(0,1fr) 460px}
.paper{padding:28px 32px 120px;max-width:860px;width:100%;margin:0 auto}
.phead{margin-bottom:18px}
.phead .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:600}
.phead h2{font-size:20px;margin:2px 0 4px}
.instr{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 16px;color:var(--ink-2)}
.instr p{margin:.3em 0}
.instr blockquote{margin:10px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:17px/1.6 var(--read)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px}
.q label,.q .qt{display:block;font-weight:600;margin-bottom:10px;color:var(--ink)}
.q .qn{color:var(--mute);font-weight:500;margin-right:6px}
.q .gloss{color:var(--mute);font-size:14px;margin:-6px 0 10px}
textarea,.q input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.6;transition:border-color .15s}
textarea:focus,.q input:focus,.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}
textarea{min-height:110px;resize:vertical}
textarea.long{min-height:300px}
.wc{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--mute)}
.wc .meter{flex:1;max-width:180px}
.wc b{font-variant-numeric:tabular-nums}
.wc.ok b{color:var(--ok)}.wc.ok .meter i{background:var(--ok)}
.wc.low b{color:var(--warn)}.wc.low .meter i{background:var(--warn)}
.wc.high b{color:var(--bad)}.wc.high .meter i{background:var(--bad)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.panel{border-left:1px solid var(--line);background:var(--surface);position:sticky;top:60px;height:calc(100vh - 60px);display:none;flex-direction:column}
.ebody.open .panel{display:flex}
.panel .ptabs{display:flex;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.panel .ptabs button{border:0;background:none;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mute);min-height:32px}
.panel .ptabs button.on{background:var(--surface-2);color:var(--ink)}
.panel .pbody{overflow:auto;padding:16px 18px 40px;flex:1}
@media (max-width:1180px){
  .ebody.open{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;top:60px;right:0;width:min(460px,100vw);z-index:30;box-shadow:var(--shadow-lg)}
}
@media (max-width:760px){
  .fbar{height:auto;min-height:60px;flex-wrap:wrap;padding:8px 12px}.fbar .title{max-width:52vw}
  .steps{order:5;width:100%;overflow-x:auto;margin:0}.paper{padding:18px 14px 120px}
  .fbar .hide-sm{display:none}
}
/* speaking */
.spk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.spk .pics{position:sticky;top:84px;display:grid;gap:10px}
.spk .pics img{width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block;background:var(--surface-2)}
.spk .pics .none{border:1px dashed var(--line-2);border-radius:var(--radius);padding:28px;color:var(--mute);text-align:center}
@media (max-width:900px){.spk{grid-template-columns:1fr}.spk .pics{position:static}}
.qbig{font:600 20px/1.45 var(--read);margin:4px 0 6px}
.recorder{display:flex;align-items:center;gap:18px;margin:18px 0}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--surface-2)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.rec .fg{stroke:var(--bad)}.ring.prep .fg{stroke:var(--warn)}
.ring button{position:absolute;inset:10px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.ring.rec button{background:var(--bad);color:#fff}
.ring button svg{width:26px;height:26px}
.rstate{font-size:14px}.rstate b{display:block;font:600 22px var(--mono)}
audio{height:36px;max-width:100%}

/* ---------- markdown ---------- */
.md{line-height:1.7;overflow-wrap:anywhere}
.md h1{font-size:22px;margin:0 0 12px}.md h2{font-size:18px;margin:28px 0 10px;padding-top:4px}.md h3{font-size:16px;margin:22px 0 8px}.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:.55em 0}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:10px 0;font-size:14px}
.md th{background:var(--surface-2);text-align:left;font-weight:600}
.md td,.md th{border:1px solid var(--line);padding:6px 10px;vertical-align:top;overflow-wrap:normal;word-break:normal}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--brand-line);background:var(--surface-2);border-radius:0 8px 8px 0}
.md details{border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:10px 0;background:var(--surface)}
.md summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.md code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.92em;font-family:var(--mono)}
.md pre{white-space:pre-wrap;background:var(--surface-2);padding:12px 14px;border-radius:8px;border:1px solid var(--line)}.md pre code{padding:0;background:none}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md ul,.md ol{padding-left:22px}
.doc{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.doc .toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;font-size:13px}
.doc .toc a{display:block;padding:5px 10px;border-radius:6px;color:var(--ink-2);border-left:2px solid transparent}
.doc .toc a:hover{background:var(--surface-2);text-decoration:none}
.doc .toc a.on{color:var(--brand);border-left-color:var(--brand);background:var(--brand-soft)}
.doc .toc a.h3{padding-left:22px;color:var(--mute)}

/* chuỗi ngày: ngày đủ phút tối thiểu +1; ngày nghỉ phép giữ chuỗi; hôm nay chưa đủ thì chưa tính là đứt */
const streakOf = (study, freezes, minSec, today) => {
  const ok = d => daySec(study, d) >= minSec;
  let d = ok(today) || freezes.includes(today) ? today : addDays(today, -1), n = 0;
  while (ok(d) || freezes.includes(d)) { if (ok(d)) n++; d = addDays(d, -1); }
  return n;
};
const bestStreak = (study, freezes, minSec, today) => {
  const days = Object.keys(study).sort();
  let best = 0, cur = 0;
  for (let d = days[0]; d && d <= today; d = addDays(d, 1)) {
    if (daySec(study, d) >= minSec) best = Math.max(best, ++cur);
    else if (!freezes.includes(d) && d !== today) cur = 0;
  }
  return best;
};

const wordDiff = (a, b) => {
  const x = a.trim().split(/\s+/), y = b.trim().split(/\s+/), n = x.length, m = y.length;
  const L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [], push = (t, w) => { const l = out[out.length - 1]; l && l[0] === t ? l[1].push(w) : out.push([t, [w]]); };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && x[i] === y[j]) { push('=', x[i]); i++; j++; }
    else if (i < n && (j >= m || L[i + 1][j] >= L[i][j + 1])) { push('-', x[i]); i++; }
    else { push('+', y[j]); j++; }
  }
  return out.map(([t, ws]) => { const s = esc(ws.join(' ')); return t === '=' ? s : t === '+' ? `<ins>${s}</ins>` : `<del>${s}</del>`; }).join(' ');
};

const phraseRe = en => new RegExp('\\b' + en.toLowerCase().trim().split(/\s+/).map(w => /^(sb|sth|someone|something|one's|sb's)$/.test(w) ? "[\\w'-]+(?:\\s+[\\w'-]+){0,2}"
  : w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/^(.{3,}?)(e|es|s|y|ed|ing)?$/, (_, st) => w.length > 4 ? st + "[\\w'-]*" : w + '(?:s|es|d|ed|ing)?')).join('\\s+') + '\\b', 'i');
const near = (a, b) => {  // khoảng cách Levenshtein ≤ 1 lỗi gõ mỗi 12 ký tự
  const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i, ...new Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n] <= Math.max(1, Math.floor(Math.max(m, n) / 12));
};

/* markdown → DOM: sửa đường dẫn ảnh/link, bỏ emoji ở tiêu đề */
function md(text, path='web/'){
  const div = document.createElement('div'); div.className = 'md';
  div.innerHTML = marked.parse(text);
  const base = location.origin + '/' + path;
  div.querySelectorAll('img').forEach(i => { i.src = new URL(i.getAttribute('src'), base).href; i.loading = 'lazy'; i.alt ||= 'Tranh đề'; });
  // bỏ emoji trang trí (giữ ❌ ✅ vì mang nghĩa sai/đúng)
  const tw = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());) n.textContent = n.textContent.replace(EMOJI, m => '❌✅'.includes(m) ? m : '');
  div.querySelectorAll('h1,h2,h3,h4,summary').forEach(h => { const t = h.firstChild; if (t?.nodeType === 3) t.textContent = t.textContent.replace(/^\s+/, ''); });
  div.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^(https?:|mailto:)/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (h.startsWith('#')) { const id = h.slice(1); a.href = 'javascript:void 0'; a.onclick = () => document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); return; }
    const u = new URL(h, base).pathname.slice(1), it = ITEMS.find(x => x.path === u);
    a.href = it ? '#/de/' + it.id : u.endsWith('.md') ? '#/doc/' + u : '/' + u;
  });
  div.querySelectorAll('code.language-chart').forEach(c => {
    let spec; try { spec = JSON.parse(c.textContent); } catch { return; }
    const box = document.createElement('div'); box.className = 'chart'; box.setAttribute('role', 'img');
    box.setAttribute('aria-label', spec.title || 'Biểu đồ đề bài');
    const cv = document.createElement('canvas'); box.append(cv); c.closest('pre').replaceWith(box);
    setTimeout(() => drawChart(cv, spec));
  });
  return div;
}

      borderWidth: pie ? 2 : c.type === 'line' ? 2 : 0, borderRadius: c.type === 'bar' ? 4 : 0, pointRadius: 4, tension: 0}))},
    options: {responsive: true, maintainAspectRatio: false, animation: false,

function suggestLessons(n = 3, crit = null, errs = null){
  if (!crit) { const w = [...(critAvg('writing') || []).map(([k, v]) => [k === 'TA/TR' ? 'TR' : k, v]), ...(critAvg('speaking') || [])].filter(x => x[1] != null).sort((a, b) => a[1] - b[1]);
    crit = w.slice(0, 2).map(x => x[0]); }
  if (!errs) { const tot = {}; ATTEMPTS.slice(-5).forEach(a => Object.entries(jsonish(a.errors)).forEach(([k, v]) => tot[k] = (tot[k] || 0) + (+v || 0)));
    errs = Object.entries(tot).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => k); }
  const score = l => (crits(l).some(c => crit.includes(c)) ? 2 : 0) + ((l.errors || '').split(',').some(e => errs.includes(e)) ? 2 : 0) - (+l.order || 0) / 100;
  const pool = LESSONS.filter(l => l.kind === 'lesson' && !lessonDone(l.id));
  return pool.sort((a, b) => score(b) - score(a) || HOC_GROUPS.findIndex(g => g[0] === a.group) - HOC_GROUPS.findIndex(g => g[0] === b.group)).slice(0, n);
}

function quizView(text, onDone){

  mr.ondataavailable = e => chunks.push(e.data);

      ta.value = (finalText + interim).trim(); };

    draft[g.key] = ta.value; draft[g.key + ':sec'] = Math.round((Date.now() - t0) / 1000); saveDraft(); onDone();
  };
  return true;
}

const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
async function buildMock(){
  const pool = part => { const xs = ITEMS.filter(x => x.skill === 'speaking' && x.part == part), k = xs.filter(isKey);
    return ui.mockKey && k.length >= 3 ? k : xs; };
  const load = async it => { const t = body(await getText(it.path)); return {it, main: t.split(/^## Bài mẫu/m)[0]}; };
  const steps = [];
  const topics = shuffle(pool(1)).slice(0, 3);
  for (const it of topics) { const {main} = await load(it);
    shuffle(parseSpeaking(main, 1)).slice(0, topics.length < 3 ? 4 : 3).forEach(q => steps.push({part: 1, examId: it.id, title: it.title, question: q.text, limit: 35})); }
  let got = null;
  for (const it of shuffle(pool(2))) { const x = await load(it); if (cueCard(x.main)) { got = x; break; } }
  if (!steps.length || !got) return null;
  const cue = cueCard(got.main), base = {examId: got.it.id, title: got.it.title, path: got.it.path, cue};
  steps.push({...base, part: 2, question: cueTitle(cue), limit: 120, prep: 60});
  parseSpeaking(got.main, 2).slice(0, 4).forEach(q => steps.push({...base, part: 3, question: q.text, limit: 60}));
  return {startedAt: Date.now(), steps, i: 0, ans: {}};
}

function mockRecord(limit, onText, onTick, onStart){
  return new Promise(res => {
    const chunks = [], mr = new MediaRecorder(mockStream), t0 = Date.now();
    let text = '', live = true, rec;
    mr.ondataavailable = e => chunks.push(e.data);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) { rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; let fin = '';
      rec.onresult = e => { let inter = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const x = e.results[i]; x.isFinal ? fin += x[0].transcript.trim() + ' ' : inter += x[0].transcript; }
        text = (fin + inter).trim(); onText(text); };
      rec.onend = () => { if (live) try { rec.start() } catch {} };
      try { rec.start(); } catch {} }
    mr.onstop = () => res({text, seconds: Math.round((Date.now() - t0) / 1000), url: URL.createObjectURL(new Blob(chunks, {type: mr.mimeType}))});
    mr.start(); onStart();
    stopRec = () => { if (!live) return; live = false; stopRec = null; clearInterval(timerInt); timerInt = null; rec?.stop(); setTimeout(() => mr.state !== 'inactive' && mr.stop(), 400); };
    countdown(limit, onTick, () => stopRec?.());
  });
}

const RT_TYPE = {tfng: 'True / False / Not Given', ynng: 'Yes / No / Not Given', headings: 'Matching headings', 'match-info': 'Matching information',

    })); });
  return rows.sort((a, b) => a.n - b.n);
};

    const r = await fetch('/api/rl', {method: 'POST', body: JSON.stringify({skill: 'reading', source: T.title + (part ? ` · Passage ${part}` : ''), test: id, part, raw, keyed, band, rows})}).then(r => r.json()).catch(e => ({error: e.message}));
    if (r.error) toast('Chưa lưu được vào lịch sử: ' + r.error, 5000);
    RLLOG = await fetch('/api/rl').then(r => r.json()).catch(() => RLLOG);
    cur = parts[0]; showQ = false; draw(); toast(`${raw}/${keyed} câu đúng · band ${band}${part ? ' (quy đổi tương đương)' : ''}`, 5000);
  }
  function start(){
    if (!D.done) { draw();  // đồng hồ lưu số giây còn lại: rời trang thì tạm dừng, quay lại làm tiếp
      countdown(D.left ?? sec, s => { if (s !== D.left) { D.left = s; save(); } const el = $('#rtt'); if (!el) return;
        el.textContent = s >= 60 ? `${Math.ceil(s / 60)} phút` : `${s} giây`; el.className = 'timer' + (s <= 300 ? ' low' : s <= 600 ? ' warn' : ''); },
        () => { if (!D.done) { toast('Hết giờ: bài đã được nộp tự động.', 6000); submit(); } });
    } else draw();
  }
  start();
}

load().then(route).catch(e => { app.innerHTML = `<div class="card pad">Không tải được dữ liệu. Chạy <code>python3 server.py</code> rồi mở <a href="http://localhost:8766">localhost:8766</a>.<br><span class="mute small">${esc(e.message)}</span></div>`; });
</script>
