<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap&subset=vietnamese" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f7f7f9;--surface:#fff;--surface-2:#f2f2f6;--ink:#111827;--ink-2:#374151;--mute:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;
  --brand:#4338ca;--brand-ink:#fff;--brand-soft:#eef2ff;--brand-line:#c7d2fe;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --side:240px;--focus:0 0 0 3px rgba(67,56,202,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0d12;--surface:#12151c;--surface-2:#191d26;--ink:#e5e7eb;--ink-2:#cbd5e1;--mute:#9ca3af;--line:#232833;--line-2:#303746;
  --brand:#818cf8;--brand-ink:#0b0d12;--brand-soft:#1e1b4b;--brand-line:#3730a3;
  --ok:#4ade80;--ok-soft:#052e16;--warn:#fbbf24;--warn-soft:#3a2a05;--bad:#f87171;--bad-soft:#3b0a0a;
  --shadow:none;--shadow-lg:0 12px 32px rgba(0,0,0,.5);--focus:0 0 0 3px rgba(129,140,248,.45)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
[data-lucide],svg.lucide{width:18px;height:18px;stroke-width:1.9;flex:none}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--surface);padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 18px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;margin:1px 0}
.nav a:hover{background:var(--surface-2);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:14px 10px 4px;font-weight:600}
.side .count{margin-top:auto;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface-2)}
.side .count b{font-size:22px;display:block;line-height:1.2}
.content{margin-left:var(--side);min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:28px 32px 96px}
.tabbar{display:none}
@media (max-width:900px){
  .side{display:none}.content{margin-left:0}main{padding:18px 16px 96px}
  .tabbar{display:flex;position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--mute);min-height:52px}
  .tabbar a.on{color:var(--brand)}.tabbar a:hover{text-decoration:none}
  .tabbar{overflow-x:auto}.tabbar a{flex:1 0 62px;white-space:nowrap}
}
body.focus .side,body.focus .tabbar{display:none}
body.focus .content{margin-left:0}
body.focus main{max-width:none;padding:0}

/* ---------- primitives ---------- */
h1{font-size:24px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:0}
.sub{color:var(--mute);margin:0 0 20px}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.section{margin-top:32px}
.section-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:38px;padding:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.key{background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mute);min-height:30px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none;min-height:36px}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px 0 36px}
.search [data-lucide],.search svg{position:absolute;left:11px;top:10px;color:var(--mute)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.meter.target::after{content:"";position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:var(--t)}
.kpi{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.label{font-size:13px;color:var(--mute);font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:var(--shadow-lg);max-width:90vw}

/* ---------- list table ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.group{margin-top:24px}
.group-h{display:flex;align-items:center;gap:10px;padding:0 4px 8px;flex-wrap:wrap}
.group-h h2{font-size:15px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 20px;align-items:center;gap:12px;padding:0 14px 0 6px;min-height:52px;border-top:1px solid var(--line);color:inherit}
.r:first-child{border-top:0}
.r:hover{background:var(--surface-2);text-decoration:none}
.r .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .m{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sc{font-size:13px;color:var(--mute);text-align:right;min-width:64px;font-variant-numeric:tabular-nums}
.st{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--line-2);border-radius:8px}
.st:hover{background:var(--surface)}
.st.done{color:var(--ok)}.st.doing{color:var(--warn)}
@media (max-width:640px){.r{grid-template-columns:40px minmax(0,1fr) auto 16px}.r .sc{display:none}.toolbar .search{max-width:none;flex-basis:100%}.seg{max-width:100%;overflow-x:auto}}

/* ---------- exam ---------- */
.fbar{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}
.fbar .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.steps{display:flex;gap:4px;margin:0 auto}
.steps button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);height:34px;min-width:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.steps button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.steps button .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.steps button .dot.full{background:var(--ok)}
.timer{font:600 15px "JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.ebody{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 60px)}
.ebody.open{grid-template-columns:minmax(0,1fr) 460px}
.paper{padding:28px 32px 120px;max-width:860px;width:100%;margin:0 auto}
.phead{margin-bottom:18px}
.phead .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:600}
.phead h2{font-size:20px;margin:2px 0 4px}
.instr{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 16px;color:var(--ink-2)}
.instr p{margin:.3em 0}
.instr blockquote{margin:10px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px}
.q label,.q .qt{display:block;font-weight:600;margin-bottom:10px;color:var(--ink)}
.q .qn{color:var(--mute);font-weight:500;margin-right:6px}
.q .gloss{color:var(--mute);font-size:14px;margin:-6px 0 10px}
textarea,.q input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.6;transition:border-color .15s}
textarea:focus,.q input:focus,.search input:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}
textarea{min-height:110px;resize:vertical}
textarea.long{min-height:300px}
.wc{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--mute)}
.wc .meter{flex:1;max-width:180px}
.wc b{font-variant-numeric:tabular-nums}
.wc.ok b{color:var(--ok)}.wc.ok .meter i{background:var(--ok)}
.wc.low b{color:var(--warn)}.wc.low .meter i{background:var(--warn)}
.wc.high b{color:var(--bad)}.wc.high .meter i{background:var(--bad)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.panel{border-left:1px solid var(--line);background:var(--surface);position:sticky;top:60px;height:calc(100vh - 60px);display:none;flex-direction:column}
.ebody.open .panel{display:flex}
.panel .ptabs{display:flex;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.panel .ptabs button{border:0;background:none;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mute);min-height:32px}
.panel .ptabs button.on{background:var(--surface-2);color:var(--ink)}
.panel .pbody{overflow:auto;padding:16px 18px 40px;flex:1}
@media (max-width:1180px){
  .ebody.open{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;top:60px;right:0;width:min(460px,100vw);z-index:30;box-shadow:var(--shadow-lg)}
}
@media (max-width:760px){
  .fbar{height:auto;min-height:60px;flex-wrap:wrap;padding:8px 12px}.fbar .title{max-width:52vw}
  .steps{order:5;width:100%;overflow-x:auto;margin:0}.paper{padding:18px 14px 120px}
  .fbar .hide-sm{display:none}
}
/* speaking */
.spk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.spk .pics{position:sticky;top:84px;display:grid;gap:10px}
.spk .pics img{width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block;background:var(--surface-2)}
.spk .pics .none{border:1px dashed var(--line-2);border-radius:var(--radius);padding:28px;color:var(--mute);text-align:center}
@media (max-width:900px){.spk{grid-template-columns:1fr}.spk .pics{position:static}}
.qbig{font-size:19px;font-weight:600;line-height:1.45;margin:4px 0 6px}
.recorder{display:flex;align-items:center;gap:18px;margin:18px 0}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--surface-2)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.rec .fg{stroke:var(--bad)}.ring.prep .fg{stroke:var(--warn)}
.ring button{position:absolute;inset:10px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.ring.rec button{background:var(--bad);color:#fff}
.ring button svg{width:26px;height:26px}
.rstate{font-size:14px}.rstate b{display:block;font:600 22px "JetBrains Mono",monospace}
audio{height:36px;max-width:100%}

/* ---------- markdown ---------- */
.md{line-height:1.7;overflow-wrap:anywhere}
.md h1{font-size:22px;margin:0 0 12px}.md h2{font-size:18px;margin:28px 0 10px;padding-top:4px}.md h3{font-size:16px;margin:22px 0 8px}.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:.55em 0}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:10px 0;font-size:14px}
.md th{background:var(--surface-2);text-align:left;font-weight:600}
.md td,.md th{border:1px solid var(--line);padding:6px 10px;vertical-align:top;overflow-wrap:normal;word-break:normal}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--brand-line);background:var(--surface-2);border-radius:0 8px 8px 0}
.md details{border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:10px 0;background:var(--surface)}
.md summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.md code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.92em;font-family:"JetBrains Mono",monospace}
.md pre{white-space:pre-wrap;background:var(--surface-2);padding:12px 14px;border-radius:8px;border:1px solid var(--line)}.md pre code{padding:0;background:none}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md ul,.md ol{padding-left:22px}
.doc{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.doc .toc{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;font-size:13px}
.doc .toc a{display:block;padding:5px 10px;border-radius:6px;color:var(--ink-2);border-left:2px solid transparent}
.doc .toc a:hover{background:var(--surface-2);text-decoration:none}
.doc .toc a.on{color:var(--brand);border-left-color:var(--brand);background:var(--brand-soft)}
.doc .toc a.h3{padding-left:22px;color:var(--mute)}
@media (max-width:1000px){.doc{grid-template-columns:1fr}.doc .toc{display:none}}
.score-head{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:var(--brand-soft);margin-bottom:12px}
.score-head .kpi{color:var(--brand)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.sel{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:160px}
.chart{position:relative;height:340px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:12px 0}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.cue blockquote{border:0;background:none;padding:0;margin:0}
.crit{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rlgrid{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 28px;gap:6px 8px;align-items:center}
.rlgrid input,.rlgrid select{height:34px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 8px;width:100%;min-width:0}
.rlgrid .n{font:600 13px "JetBrains Mono",monospace;color:var(--mute);text-align:right}
.rlgrid .okc{color:var(--ok)}.rlgrid .bad{color:var(--bad)}
@media (max-width:640px){.rlgrid{grid-template-columns:34px 1fr 1fr 22px}.rlgrid select{grid-column:2/4}.rlgrid.small span:nth-child(4){display:none}}
@media print{.side,.tabbar,.fbar,.panel,.noprint{display:none!important}.content{margin:0}}
</style>
</head>
<body>
<a class="skip" href="#app">Bỏ qua điều hướng</a>
<aside class="side" aria-label="Điều hướng">
  <div class="brand"><span class="logo">IE</span>IELTS Practice</div>
  <nav class="nav" id="nav"></nav>
  <div class="count" id="countdown"></div>
</aside>
<div class="content"><main id="app" tabindex="-1"></main></div>
<nav class="tabbar" id="tabbar" aria-label="Điều hướng"></nav>
<script>
const TARGET = {writing: 7, speaking: 7, reading: 7};
const SKILLS = {writing: 'Writing', speaking: 'Speaking', reading: 'Reading'};
const CLUSTERS = {education:'Giáo dục', work:'Công việc & sự nghiệp', technology:'Công nghệ', media:'Truyền thông & quảng cáo',
  environment:'Môi trường', health:'Sức khoẻ & thể thao', urban:'Đô thị & giao thông', family:'Gia đình & các thế hệ',
  culture:'Văn hoá & toàn cầu hoá', government:'Chính phủ & xã hội', crime:'Tội phạm & pháp luật', economy:'Kinh tế & tiêu dùng',
  'daily-life':'Đời sống hằng ngày', leisure:'Giải trí & sở thích', travel:'Du lịch & nơi chốn'};
const QTYPE = {opinion:'Opinion · agree/disagree', discussion:'Discussion · both views', 'two-part':'Two-part / direct questions',
  'problem-solution':'Problem / cause – solution', 'adv-dis':'Advantages / disadvantages',
  bar:'Bar chart', line:'Line graph', pie:'Pie chart', table:'Table', mixed:'Mixed charts', process:'Process', map:'Map',
  person:'Person', place:'Place', object:'Object / media', event:'Event / activity', experience:'Experience'};
const W_PARTS = {1:['Task 1 · Academic report','Tối thiểu 150 từ · gợi ý 20 phút'], 2:['Task 2 · Essay','Tối thiểu 250 từ · gợi ý 40 phút']};
const S_PARTS = {1:['Part 1 · Interview','Câu hỏi ngắn · 20–30 giây mỗi câu'], 2:['Part 2 + 3 · Cue card & discussion','1 phút chuẩn bị · nói 2 phút · rồi thảo luận']};
const SP_LIMIT = {1:40, 2:120, 3:60};
const W_RANGE = {1:[150,200], 2:[250,320]};
const W_MIN = {1:20, 2:40};

/* markdown → DOM: sửa đường dẫn ảnh/link, bỏ emoji ở tiêu đề */
function md(text, path='web/'){
  const div = document.createElement('div'); div.className = 'md';
  div.innerHTML = marked.parse(text);
  const base = location.origin + '/' + path;
  div.querySelectorAll('img').forEach(i => { i.src = new URL(i.getAttribute('src'), base).href; i.loading = 'lazy'; i.alt ||= 'Tranh đề'; });
  // bỏ emoji trang trí (giữ ❌ ✅ vì mang nghĩa sai/đúng)
  const tw = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());) n.textContent = n.textContent.replace(EMOJI, m => '❌✅'.includes(m) ? m : '');
  div.querySelectorAll('h1,h2,h3,h4,summary').forEach(h => { const t = h.firstChild; if (t?.nodeType === 3) t.textContent = t.textContent.replace(/^\s+/, ''); });
  div.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^(https?:|mailto:)/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (h.startsWith('#')) { const id = h.slice(1); a.href = 'javascript:void 0'; a.onclick = () => document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); return; }
    const u = new URL(h, base).pathname.slice(1), it = ITEMS.find(x => x.path === u);
    a.href = it ? '#/de/' + it.id : u.endsWith('.md') ? '#/doc/' + u : '/' + u;
  });
  div.querySelectorAll('code.language-chart').forEach(c => {
    let spec; try { spec = JSON.parse(c.textContent); } catch { return; }
    const box = document.createElement('div'); box.className = 'chart'; box.setAttribute('role', 'img');
    box.setAttribute('aria-label', spec.title || 'Biểu đồ đề bài');
    const cv = document.createElement('canvas'); box.append(cv); c.closest('pre').replaceWith(box);
    setTimeout(() => drawChart(cv, spec));
  });
  return div;
}
/* biểu đồ Task 1: {"type":"bar|line|pie","title","unit","labels":[],"datasets":[{"label","data":[]}]} */
const SERIES = ['#4338ca', '#d97706', '#0f766e', '#be185d', '#64748b', '#65a30d'];
function drawChart(cv, c){
  if (!window.Chart) return;
  const css = getComputedStyle(document.body), ink = css.getPropertyValue('--ink-2').trim(), grid = css.getPropertyValue('--line').trim();
  const pie = c.type === 'pie';
  new Chart(cv, {type: c.type === 'line' ? 'line' : pie ? 'pie' : 'bar',
    data: {labels: c.labels, datasets: c.datasets.map((d, i) => ({label: d.label, data: d.data,
      backgroundColor: pie ? SERIES : SERIES[i % SERIES.length], borderColor: pie ? css.getPropertyValue('--surface').trim() : SERIES[i % SERIES.length],
      borderWidth: pie ? 2 : c.type === 'line' ? 2 : 0, borderRadius: c.type === 'bar' ? 4 : 0, pointRadius: 4, tension: 0}))},
    options: {responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {title: {display: !!c.title, text: c.title + (c.unit && !pie ? ` (${c.unit})` : ''), color: ink, font: {size: 14, weight: '600'}},
        legend: {labels: {color: ink}}, tooltip: {callbacks: {label: x => `${x.dataset.label || x.label}: ${x.formattedValue}${c.unit && c.unit.startsWith('%') ? '%' : ''}`}}},
      scales: pie ? {} : {x: {ticks: {color: ink}, grid: {display: false}}, y: {beginAtZero: true, ticks: {color: ink}, grid: {color: grid}}}}});
}

const mean = xs => xs.reduce((s, x) => s + x, 0) / xs.length;
function estBand(skill){  // trung bình 3 lần gần nhất; Writing = (T1 + 2·T2) / 3
  const last = f => { const xs = ATTEMPTS.filter(a => a.skill === skill && a.band && f(a)).slice(-3).map(a => +a.band); return xs.length ? mean(xs) : null; };
  if (skill === 'writing') { const t1 = last(a => a.part == 1), t2 = last(a => a.part == 2);
    return t1 != null && t2 != null ? Math.floor((t1 + 2 * t2) / 3 * 2) / 2 : t2 ?? t1; }
  if (skill === 'speaking') { const x = last(() => true); return x == null ? null : Math.floor(x * 2) / 2; }
  const xs = RLLOG.filter(e => e.skill === skill && e.band != null).slice(-3).map(e => +e.band);
  return xs.length ? half(mean(xs)) : null;
}
function recentDrafts(){
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!k.startsWith('draft:')) continue;
    const d = JSON.parse(localStorage.getItem(k) || '{}'), it = ITEMS.find(x => x.id === k.slice(6));
    if (it && d._t && it.status !== 'done') out.push({it, t: d._t}); } } catch {}
  return out.sort((a, b) => b.t - a.t).slice(0, 3).map(x => x.it);
}

function bindStatus(){
  app.querySelectorAll('.st[data-id]').forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    const it = ITEMS.find(x => x.id === b.dataset.id), nxt = {todo:'doing', doing:'done', done:'todo'}[it.status] || 'doing';
    const r = await fetch('/api/status', {method:'POST', body: JSON.stringify({id: it.id, status: nxt})});
    if (!r.ok) return toast('Không lưu được trạng thái');
    it.status = nxt; b.className = 'st ' + nxt; b.innerHTML = ic(ST_ICON[nxt]); icons();

function toolbar(extra=''){

function bindToolbar(rerender){

  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { ui.wgroup = b.dataset.g; saveUi(); rerender(); });

const applyFilters = xs => { const q = ui.q.trim().toLowerCase();

function groups(xs, key, labels){
  const g = {};
  xs.forEach(x => (g[x[key] || 'khac'] ||= []).push(x));
  const out = Object.entries(g).sort((a, b) => b[1].length - a[1].length).map(([k, arr]) => {

    const done = arr.filter(x => x.status === 'done').length;
    return `<section class="group"><div class="group-h"><h2>${esc(labels[k] || (k === 'khac' ? 'Khác' : k))}</h2><span class="small mute">${arr.length} đề · ${arr.filter(isKey).length} trọng điểm · ${done} xong</span></div>
      <div class="rows">${arr.map(row).join('')}</div></section>`;
  }).join('');

  const d = md(body(await getText(path)), path);

  app.innerHTML = `${title ? `<h1>${title}</h1><p class="sub">${subtitle}</p>${extra}` : `<p class="small"><a href="javascript:history.back()">${ic('arrow-left')} Quay lại</a></p>`}

  const links = [...app.querySelectorAll('.toc a')];

/* ---------- làm bài ---------- */
let timerInt = null, stopRec = null;
function stopAll(){ clearInterval(timerInt); timerInt = null; stopRec?.(); stopRec = null; try { speechSynthesis.cancel(); } catch {} }
function countdown(sec, onTick, done){
  clearInterval(timerInt);
  const end = Date.now() + sec * 1000;
  const tick = () => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); onTick(s);
    if (!s) { clearInterval(timerInt); timerInt = null; done?.(); } };
  tick(); timerInt = setInterval(tick, 250);
}
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const wc = t => (t.trim().match(/\S+/g) || []).length;
function download(name, content, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; a.click(); }

          <button class="btn ghost icon" id="pclose" style="margin-left:auto;height:32px;width:32px" aria-label="Đóng">${ic('x')}</button></div>

  const exportAs = kind => {
    const fname = id + '-' + new Date().toISOString().slice(0, 10), html = marked.parse(exportText());

    if (kind === 'doc') download(fname + '.doc', `<html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial">${html}</body></html>`, 'application/msword');
    if (kind === 'pdf') { const w = window.open(''); w.document.write(`<html><head><meta charset="utf-8"><title>${esc(fname)}</title></head><body style="font-family:Arial;max-width:760px;margin:auto;line-height:1.6">${html}</body></html>`); w.document.close(); w.print(); }

}

function bandHead(res, T){
  const b = res?.band; if (b == null) return '<p class="mute small">Không đọc được band từ nhận xét (thiếu khối json).</p>';

      <div class="small mute" style="margin-top:6px">Trung bình tiêu chí ${res.raw != null ? (+res.raw).toFixed(2) : '—'}, làm tròn xuống nửa band · máy chấm hiện có xu hướng <b>thấp hơn</b> giám khảo khoảng 0.5 band (xem tools/calibrate.py)</div></div></div>`;

/* ---- writing ---- */
function parseWriting(main, task){
  const intro = (main.split(/^## Đề\s*$/m)[1] ?? main).split(/^## /m)[0];
  const prompt = (intro.match(/^>.*$/gm) || []).map(l => l.replace(/^>\s?/, '')).join(' ').replace(/\s+/g, ' ').trim();
  return [{part: task, key: 't' + task, label: `Writing Task ${task}`, text: prompt || `Writing Task ${task}`, range: W_RANGE[task], intro}];
}
function renderWriting(qs, draft, saveDraft, path){
  const q = qs[0], paper = $('#paper');
  paper.innerHTML = `<div class="phead"><div class="kicker">Writing · Task ${q.part}</div><h2>${W_PARTS[q.part][0]}</h2><div class="small mute">${W_PARTS[q.part][1]} · không có kiểm tra chính tả, như thi máy</div></div>`;
  const d = md(q.intro, path); d.classList.add('instr'); paper.append(d);
  const box = document.createElement('div'); box.className = 'q';
  box.innerHTML = `<label for="f1">Bài viết của bạn</label>
    <textarea id="f1" spellcheck="false" autocomplete="off" style="min-height:${q.part == 2 ? 480 : 340}px"></textarea>
    <div class="wc"><span><b>0</b> từ · tối thiểu ${q.range[0]}</span><div class="meter"><i></i></div><span class="mute" id="wnote"></span></div>`;
  paper.append(box);
  const inp = box.querySelector('textarea'), w = box.querySelector('.wc');
  inp.value = draft[q.key] || '';
  const upd = () => { const c = wc(inp.value), [lo, hi] = q.range;
    w.className = 'wc ' + (!c ? '' : c < lo ? 'low' : 'ok'); w.querySelector('b').textContent = c;
    w.querySelector('.meter i').style.width = Math.min(100, c / lo * 100) + '%';
    $('#wnote').textContent = c > hi ? 'Dài hơn mức cần — không bị trừ điểm nhưng tốn thời gian' : c && c < lo ? `Thiếu ${lo - c} từ — sẽ bị trừ điểm` : ''; };
  inp.oninput = () => { draft[q.key] = inp.value; saveDraft(); upd(); };
  upd();
  $('#steps').innerHTML = '';
  const min = W_MIN[q.part];
  $('#tm').innerHTML = `<button class="timer" id="tbtn" title="Bấm để bắt đầu đếm ${min} phút">${ic('timer')}<span>${min}:00</span></button>`;
  $('#tbtn').onclick = () => countdown(min * 60, s => { $('#tbtn span').textContent = mmss(s); $('#tbtn').classList.toggle('low', s <= 180); }, () => toast(`Hết ${min} phút — nộp bài để chấm.`, 6000));
  return {groups: qs};
}

/* ---- speaking ---- */
function parseSpeaking(main, part){
  const lines = main.split('\n'), qs = []; let inD = 0;
  lines.forEach((l, i) => {
    inD += (l.match(/<details/g) || []).length - (l.match(/<\/details>/g) || []).length;
    if (inD > 0) return;
    const m = l.match(/^\*\*Q(\d+)\.\*\*\s*(.+)/) || l.match(/^\*\*(\d+)\.\s*(.+?)\*\*/);
    if (!m) return;
    const g = (lines[i + 1] || '').trim().match(/^\*([^*].*)\*$/);
    qs.push({key: 'q' + m[1], text: m[2].replace(/\*\((dịch|dựng|bổ sung|nguồn)[^)]*\)\*/g, '').replace(/\*\*/g, '').trim(),
      gloss: g ? g[1].replace(/\*\((dịch|dựng|bổ sung|nguồn)[^)]*\)\*/g, '') : '', label: `Part ${part == 1 ? 1 : 3} — Q${m[1]}`, limit: SP_LIMIT[part == 1 ? 1 : 3]});
  });
  return qs;
}
const cueCard = main => ((main.split(/^## Cue card\s*$/m)[1] || '').split(/^## /m)[0]).trim();
const cueTitle = cue => (cue.match(/\*\*(.+?)\*\*/) || [, 'Cue card'])[1];
const cuePlain = cue => cue.replace(/^>\s?/gm, '').replace(/[*#]/g, '').replace(/\s+/g, ' ').trim();
function renderSpeaking(qs, draft, saveDraft, part, main, path){
  const paper = $('#paper'); paper.style.maxWidth = '1180px';
  const cue = cueCard(main);
  const groups = part == 2 ? [{key: 'cue', label: 'Part 2 — Cue card', text: cuePlain(cue), limit: SP_LIMIT[2], prep: 60, list: [{text: cueTitle(cue)}]}, ...qs.map(q => ({...q, list: [q]}))]
    : qs.map(q => ({...q, list: [q]}));
  paper.innerHTML = `<div class="phead"><div class="kicker">Speaking</div><h2>${S_PARTS[part][0]}</h2><div class="small mute">${S_PARTS[part][1]} · Dùng Chrome/Edge để tự chuyển giọng nói thành chữ.</div></div>
    <div class="spk"><div class="pics" id="pics"></div><div id="qarea"></div></div>`;
  const pics = $('#pics');
  if (cue) { const c = md(cue, path); c.classList.add('cue'); pics.append(c); }
  else { pics.hidden = true; $('.spk').style.gridTemplateColumns = '1fr'; }

  let cur = 0;
  const steps = $('#steps');
  steps.innerHTML = groups.length > 1 ? groups.map((g, i) => `<button role="tab" data-i="${i}">${g.key === 'cue' ? 'Part 2' : `${part == 2 ? 'P3 · ' : ''}Câu ${part == 2 ? i : i + 1}`}<span class="dot"></span></button>`).join('') : '';
  const dots = () => groups.forEach((g, i) => { const d = steps.querySelector(`[data-i="${i}"] .dot`); if (d) d.className = 'dot' + ((draft[g.key] || '').trim() ? ' full' : ''); });
  const show = i => {
    stopAll(); cur = i; const g = groups[i];
    steps.querySelectorAll('[data-i]').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    const C = 2 * Math.PI * 40;
    $('#qarea').innerHTML = `<div class="q" style="padding:20px 22px">
      <div class="label">${g.prep ? 'Part 2 · chuẩn bị 1 phút, rồi nói 1–2 phút' : `${esc(g.label)} · tối đa ${g.limit} giây`}</div>
      ${g.list.map(q => `<div class="qbig">${esc(q.text)}</div>${q.gloss ? `<div class="gloss">${esc(q.gloss)}</div>` : ''}`).join('')}
      <div class="recorder">
        <div class="ring" id="ring"><svg viewBox="0 0 88 88"><circle class="bg" cx="44" cy="44" r="40"/><circle class="fg" cx="44" cy="44" r="40" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <button id="recbtn" aria-label="Bắt đầu ghi âm">${ic('mic')}</button></div>
        <div class="rstate"><b id="rtime">${mmss(g.limit)}</b><span id="rlabel" class="mute">${g.prep ? 'Bấm để chuẩn bị 1 phút, sau đó tự ghi âm' : 'Bấm để bắt đầu trả lời'}</span></div>
      </div>
      <audio controls hidden id="audio"></audio>
      <label class="label" for="tr" style="display:block;margin:12px 0 6px">Lời bạn nói (sửa lại nếu máy nghe sai)</label>
      <textarea id="tr" placeholder="Chữ sẽ hiện ở đây khi bạn nói. Không có micro thì gõ trực tiếp."></textarea>
      <div class="wc" id="twc"></div>
      <div class="pnav"><button class="btn" id="prev">${ic('arrow-left')}Câu trước</button><button class="btn primary" id="next">Câu tiếp${ic('arrow-right')}</button></div></div>`;
    const ta = $('#tr'), twc = $('#twc');
    const upd = () => { const n = wc(ta.value), sec = draft[g.key + ':sec'];
      twc.innerHTML = `<span><b>${n}</b> từ${sec ? ` · ${sec} giây · khoảng ${Math.round(n / sec * 60)} từ/phút <span class="mute">(nói tự nhiên thường 110–160)</span>` : ''}</span>`; };
    ta.value = draft[g.key] || ''; upd();
    ta.oninput = () => { draft[g.key] = ta.value; saveDraft(); upd(); dots(); };
    $('#prev').disabled = i === 0; $('#next').hidden = i === groups.length - 1;
    $('#prev').onclick = () => show(i - 1); $('#next').onclick = () => show(i + 1);
    const ring = $('#ring'), fg = ring.querySelector('.fg');
    const setRing = (s, total, cls, label) => { fg.style.strokeDashoffset = C * (1 - s / total); ring.className = 'ring ' + cls; $('#rtime').textContent = mmss(s); if (label) $('#rlabel').textContent = label; };
    let state = 'idle';
    $('#recbtn').onclick = async () => {
      if (state === 'rec') return stopRec?.();
      if (state === 'prep') { state = 'idle'; return start(); }
      if (g.prep) { state = 'prep'; $('#recbtn').innerHTML = ic('play'); icons();
        countdown(60, s => setRing(s, 60, 'prep', 'Chuẩn bị — ghi ý chính ra giấy. Bấm để nói luôn.'), () => { state = 'idle'; start(); }); return; }
      start();
    };
    const start = async () => {
      const ok = await record(g, ta, draft, saveDraft, () => { state = 'idle'; $('#recbtn').innerHTML = ic('mic'); icons(); setRing(0, 1, '', 'Đã ghi xong — nghe lại, sửa chữ rồi sang câu tiếp.'); upd(); dots(); });
      if (!ok) return;
      state = 'rec'; $('#recbtn').innerHTML = ic('square'); icons();
      countdown(g.limit, s => setRing(s, g.limit, 'rec', 'Đang ghi âm — bấm để dừng'), () => stopRec?.());
    };
    icons(); window.scrollTo(0, 0);
  };
  steps.querySelectorAll('[data-i]').forEach(b => b.onclick = () => show(+b.dataset.i));
  show(0); dots();
  $('#tm').innerHTML = '';
  return {groups};
}
async function record(g, ta, draft, saveDraft, onDone){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { toast('Không mở được micro — hãy cho phép quyền micro, hoặc gõ câu trả lời.', 5000); return false; }
  const chunks = [], mr = new MediaRecorder(stream), t0 = Date.now(), audio = $('#audio');
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstop = () => { audio.src = URL.createObjectURL(new Blob(chunks, {type: mr.mimeType})); audio.hidden = false; stream.getTracks().forEach(t => t.stop()); };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec, finalText = '', live = true;
  if (SR) {
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => { let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; r.isFinal ? finalText += r[0].transcript.trim() + ' ' : interim += r[0].transcript; }
      ta.value = (finalText + interim).trim(); };
    rec.onend = () => { if (live) try { rec.start() } catch {} };  // Chrome tự dừng khi im lặng → bật lại
    rec.start();
  } else toast('Trình duyệt không hỗ trợ chuyển giọng nói thành chữ — nghe lại bản ghi và tự gõ.', 5000);
  mr.start();
  stopRec = () => {
    if (!live) return; live = false; stopRec = null;
    rec?.stop(); if (mr.state !== 'inactive') mr.stop(); clearInterval(timerInt); timerInt = null;
    draft[g.key] = ta.value; draft[g.key + ':sec'] = Math.round((Date.now() - t0) / 1000); saveDraft(); onDone();
  };
  return true;
}

/* ---------- thi thử Speaking 12 phút ---------- */
const MOCK_KEY = 'mock:speaking';

function beep(){ try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .25); } catch {} }
function speak(text){ return new Promise(res => { if (!ui.mockTts || !window.speechSynthesis) return res();
  let done = false; const fin = () => { if (!done) { done = true; res(); } };
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = .95; u.onend = fin; u.onerror = fin;
  speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(fin, 25000); }); }

const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
async function buildMock(){
  const pool = part => { const xs = ITEMS.filter(x => x.skill === 'speaking' && x.part == part), k = xs.filter(isKey);
    return ui.mockKey && k.length >= 3 ? k : xs; };
  const load = async it => { const t = body(await getText(it.path)); return {it, main: t.split(/^## Bài mẫu/m)[0]}; };
  const steps = [];
  const topics = shuffle(pool(1)).slice(0, 3);
  for (const it of topics) { const {main} = await load(it);
    shuffle(parseSpeaking(main, 1)).slice(0, topics.length < 3 ? 4 : 3).forEach(q => steps.push({part: 1, examId: it.id, title: it.title, question: q.text, limit: 35})); }
  let got = null;
  for (const it of shuffle(pool(2))) { const x = await load(it); if (cueCard(x.main)) { got = x; break; } }
  if (!steps.length || !got) return null;
  const cue = cueCard(got.main), base = {examId: got.it.id, title: got.it.title, path: got.it.path, cue};
  steps.push({...base, part: 2, question: cueTitle(cue), limit: 120, prep: 60});
  parseSpeaking(got.main, 2).slice(0, 4).forEach(q => steps.push({...base, part: 3, question: q.text, limit: 60}));
  return {startedAt: Date.now(), steps, i: 0, ans: {}};
}

function mockRecord(limit, onText, onTick, onStart){
  return new Promise(res => {
    const chunks = [], mr = new MediaRecorder(mockStream), t0 = Date.now();
    let text = '', live = true, rec;
    mr.ondataavailable = e => chunks.push(e.data);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) { rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; let fin = '';
      rec.onresult = e => { let inter = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const x = e.results[i]; x.isFinal ? fin += x[0].transcript.trim() + ' ' : inter += x[0].transcript; }
        text = (fin + inter).trim(); onText(text); };
      rec.onend = () => { if (live) try { rec.start() } catch {} };
      try { rec.start(); } catch {} }
    mr.onstop = () => res({text, seconds: Math.round((Date.now() - t0) / 1000), url: URL.createObjectURL(new Blob(chunks, {type: mr.mimeType}))});
    mr.start(); onStart();
    stopRec = () => { if (!live) return; live = false; stopRec = null; clearInterval(timerInt); timerInt = null; rec?.stop(); setTimeout(() => mr.state !== 'inactive' && mr.stop(), 400); };
    countdown(limit, onTick, () => stopRec?.());
  });
}

    const keyed = D.rows.filter(r => r.k.trim()).length;
    if (keyed < 40 && !confirm(`Mới nhập đáp án đúng cho ${keyed}/40 câu. Câu chưa có đáp án tính là sai. Vẫn chấm?`)) return;
    const rows = D.rows.map((r, i) => ({n: i + 1, ans: r.a, key: r.k, type: r.t, ok: isRight(r.a, r.k)}));
    const raw = rows.filter(r => r.ok).length, band = rlBand(skill, raw), byType = {};
    rows.forEach(r => { const t = r.type || 'Chưa gán dạng'; (byType[t] ||= [0, 0])[1]++; if (r.ok) byType[t][0]++; });
    const res = await fetch('/api/rl', {method: 'POST', body: JSON.stringify({skill, source: D.source, raw, band, rows})}).then(r => r.json()).catch(e => ({error: e.message}));
    if (res.error) return toast('Không lưu được: ' + res.error, 5000);
    await load();
    $('#rlres').innerHTML = `<div class="score-head" style="margin-top:16px"><div class="kpi">${band}<span class="small mute">/9</span></div><div class="grow"><b>${raw}/40 câu đúng</b>
      <span class="badge ${band >= TARGET[skill] ? 'ok' : 'warn'}" style="margin-left:6px">${band >= TARGET[skill] ? 'Đạt mục tiêu 7' : `Cần thêm ${30 - raw > 0 ? 30 - raw : 0} câu để chạm band 7`}</span>
      <div class="small mute">Bảng quy đổi xấp xỉ; mỗi đề thật hiệu chỉnh riêng nên có thể lệch ±1 câu.</div></div></div>
      <div class="md"><table><tr><th>Dạng câu</th><th>Đúng</th><th>Tỉ lệ</th></tr>${Object.entries(byType).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [ok, n]]) =>
        `<tr><td>${esc(t)}</td><td>${ok}/${n}</td><td>${Math.round(ok / n * 100)}%</td></tr>`).join('')}</table></div>
      <p class="small mute">Dạng có tỉ lệ thấp nhất nằm trên cùng: luyện riêng dạng đó trước.</p>`;
    toast(`Đã lưu: ${raw}/40 · band ${band}`);
  };
  live();
}

load().then(route).catch(e => { app.innerHTML = `<div class="card pad">Không tải được dữ liệu. Chạy <code>python3 server.py</code> rồi mở <a href="http://localhost:8766">localhost:8766</a>.<br><span class="mute small">${esc(e.message)}</span></div>`; });
</script>
</body>
</html>
